name: CI

on:
  push:
    branches: [main]
  pull_request:

# Least-privilege GITHUB_TOKEN: the jobs only read the repo (checkout + install + checks).
permissions:
  contents: read

# Cancel superseded runs on the same ref (e.g. a force-push to a PR branch).
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Fast feedback: ruff only, so it needs no ML stack (uv installs just ruff/mypy).
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - run: uv sync --frozen --only-group lint
      - run: uv run ruff check .

  # mypy + pytest run against the real dependency set (uv provisions Python 3.13 and
  # installs the CUDA torch wheels per pyproject - a multi-GB install, cached by setup-uv).
  # mypy lives here, not in `lint`, so it sees pydantic/PIL/fastapi types instead of Any.
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - run: uv sync --frozen --group lint
      - run: uv run mypy src eval
      - run: uv run pytest

  # The frontend, checked with the same scripts the Dockerfile's ui-builder stage runs -
  # so a type error or a broken bundle fails the PR rather than the image build. No npm
  # dependency install beyond ui/package-lock.json; nothing here needs the ML stack.
  ui:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22            # matches the Dockerfile's node:22-slim stage
          cache: npm
          cache-dependency-path: ui/package-lock.json
      - run: npm ci --prefix ui
      - run: npm run typecheck --prefix ui
      - run: npm run test --prefix ui
      # Before the browser step, because `tsc && vite build` is the slowest of the three
      # above and they localize a failure better: a type error reads as a type error, not
      # as a build error.
      - run: npm run build --prefix ui
      # The geometry guard. It is the one check that needs a real layout engine - the page
      # frame silently cropping its image (and misplacing the citation box drawn on it) is
      # invisible to vitest in node, and to jsdom, which has no layout at all. Chromium
      # only, and no backend: the API is stubbed at the network layer and the suite runs
      # against the bundle `vite preview` serves. Costs ~40s, most of it the download.
      - run: npx playwright install --with-deps chromium
        working-directory: ui
      - run: npm run test:e2e --prefix ui
